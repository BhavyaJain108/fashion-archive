name: PR checks

# Runs on every pull request. Must stay fast (<5 min) — this is the gate
# every change passes through. Heavier checks (E2E, LLM evals) live in
# nightly / release workflows.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Lint + format are currently scoped to tests/ — the existing backend
      # has ~1600 pre-existing issues we don't want to fix drive-by. We'll
      # ratchet scope up module-by-module in follow-up PRs.
      - name: Ruff lint
        run: ruff check tests/ backend/archive/

      - name: Ruff format check
        run: ruff format --check tests/ backend/archive/

      - name: Mypy (tests only, for now)
        run: mypy

      - name: Pytest (unit only)
        run: pytest -m unit

  db-tests:
    name: Postgres-backed tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The db suite covers what a mock would get wrong: citext email
    # uniqueness, timestamptz semantics, on-delete-cascade, and the partial
    # unique indexes on favourites. It also runs apply_schema through psycopg
    # itself, which is the one path schema.sql changes cannot be checked on
    # any other way.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fashion_archive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pytest (db)
        run: pytest -m db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fashion_archive_test

  web-ui:
    name: Web UI build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: web_ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web_ui/package-lock.json

      - name: Install
        run: npm ci

      # `build` is also the lint gate: react-scripts runs eslint (react-app
      # config) during the build and CI=true turns its warnings into a
      # non-zero exit, so a stray unused import fails here.
      - name: Build
        run: npm run build
        env:
          CI: true

      # After the build, not before — it reads build/static/css.
      - name: CSS cascade order
        run: npm run check:css

      - name: Unit tests
        run: npx react-scripts test --watchAll=false
        env:
          CI: true
