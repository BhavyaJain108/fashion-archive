# Render Blueprint. Creates the database and the API service together, with the
# connection string wired between them.
#
# There is no persistent disk: images live in Cloudflare R2 and everything else
# is in Postgres. A disk would pin the service to a single instance and turn
# every deploy into a brief outage.
#
# The frontend is not here — it is a Cloudflare Pages project, so that DNS,
# image storage and the static build stay in one account.

databases:
  - name: fashion-archive-db
    plan: basic-256mb
    region: oregon

services:
  # The scraper, off the laptop. Everything it needs is in R2, so it holds no state and
  # a redeploy costs nothing but the run in flight — which is re-run, never resumed.
  #
  # It exists because the alternative was a laptop: an overnight fleet scrape slept
  # mid-run, lost the network on eighteen brands, and killed psylos1's run 19 hours in.
  # A machine that stays awake is the fix, not a longer timeout.
  - type: worker
    name: fashion-archive-scraper
    # Deployed on purpose, not on every push: a new container drops whatever the
    # daemon was scraping and the brand starts over. The API still auto-deploys;
    # the worker is deployed from the dashboard or `POST /v1/services/<id>/deploys`
    # once a batch of changes is ready and the fleet is quiet.
    autoDeploy: false
    runtime: docker
    dockerfilePath: ./Dockerfile.scraper
    region: oregon
    # Standard, because the image carries Chromium. Most brands never open it — plain
    # HTTP or T1 (a browser's TLS handshake, no browser) reads them — but a brand behind
    # a JavaScript challenge needs a real browser for ~2.5s per run to mint its cookie,
    # and that spike is ~500 MB. Two workers can both be minting at once; 2 GB fits it.
    plan: standard
    dockerCommand: python -m backend.archive.runner.cli daemon start --workers 2
    envVars:
      # The control plane lives in R2 alongside the catalogue, so cadence, pausing a
      # brand and stopping the daemon are all edits to objects — no redeploy, and no
      # database for the scraper at all.
      - key: R2_BUCKET
        value: fashion-archive
      - key: R2_PUBLIC_BASE
        value: https://images.premiumpropogandafashion.studio
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # Learning a field rule is one model call over one product page, and it is the
      # only thing here that costs money per run. It runs under a daily ceiling shared
      # by both workers and kept in the bucket, so a restart does not forget the
      # morning. Zero switches it off; `--find-fields` by hand still works either way.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FINDER_DAILY_USD
        value: "10"
      # The country the catalogue is priced for: Shopify stores with Markets serve
      # this market's own prices; the rest keep their currency and the site converts.
      - key: ARCHIVE_MARKET
        value: "US"
      # The catalogue's rows live in Postgres; runs and plans stay in R2.
      - key: CATALOG_BACKEND
        value: pg
      - key: DATABASE_URL
        fromDatabase:
          name: fashion-archive-db
          property: connectionString

  - type: web
    name: fashion-archive-api
    runtime: docker
    region: oregon
    # Chromium will not fit in the smaller plans; it gets OOM-killed mid-scrape.
    plan: standard
    healthCheckPath: /api/health
    domains:
      - api.premiumpropogandafashion.studio
    envVars:
      - key: CATALOG_BACKEND
        value: pg
      - key: DATABASE_URL
        fromDatabase:
          name: fashion-archive-db
          property: connectionString

      # 0.0.0.0, or the health check cannot reach the process and the deploy fails.
      - key: HOST
        value: 0.0.0.0
      # Never true here: the Werkzeug debugger is an interactive Python console,
      # which on a public URL is remote code execution.
      - key: DEBUG
        value: "false"

      - key: APP_BASE_URL
        value: https://premiumpropogandafashion.studio
      - key: API_BASE_URL
        value: https://api.premiumpropogandafashion.studio

      # Leading dot: the cookie must be sent to both the site and the api
      # subdomain. They are the same site, so SameSite=Lax is enough.
      - key: COOKIE_DOMAIN
        value: .premiumpropogandafashion.studio
      - key: COOKIE_SECURE
        value: "true"

      - key: R2_BUCKET
        value: fashion-archive
      - key: R2_PUBLIC_BASE
        value: https://images.premiumpropogandafashion.studio

      # sync: false means Render prompts for these and they never enter the repo.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # YouTube Data API. Video lookup is off without it rather than falling
      # back to scraping. search.list costs 100 of 10,000 daily units, so
      # results are cached permanently and only new shows spend anything.
      - key: YOUTUBE_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

      # The machine room at /dev. Comma-separated emails of the archive's owners;
      # empty refuses everyone, so it has to be set before the page opens for anyone.
      - key: ADMIN_EMAILS
        sync: false
      # The same ceiling the scraper runs under, so the deck shows the right cap.
      - key: FINDER_DAILY_USD
        value: "10"
      # The costs page reads each provider's own API. All optional: a missing key
      # shows that provider as "not connected" and nothing else on the page waits.
      - key: ANTHROPIC_ADMIN_KEY
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
