# The brand roster.
#
# This file is the list itself — edited by hand, read by the CLI, the daemon and the
# app's My Brands page. Adding a brand means adding a line here; there is no in-app
# "add brand" flow, on purpose.
#
# size: small | mid | large | multi_brand
#   Judgement about the business, not something a page announces, so it is written down
#   rather than inferred. The app shows small and mid. large (houses big enough to run
#   enterprise bot defences) and multi_brand (outlets and marketplaces selling other
#   labels, where the `brand` field stops meaning one brand) stay in the file so the
#   scraper can still be pointed at them, but they do not reach the page.

